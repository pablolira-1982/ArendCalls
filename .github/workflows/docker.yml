name: Docker Hub & GHCR Release

# Publica a imagem oficial no Docker Hub (hub.docker.com/r/nathanarend/arendcalls)
# e no GHCR a cada tag v* ou disparo manual (workflow_dispatch).
#
# Secrets necessários no GitHub para publicar no Docker Hub:
#   - DOCKERHUB_USERNAME (ex: nathanarend)
#   - DOCKERHUB_TOKEN    (Access Token gerado em hub.docker.com -> Account Settings -> Security)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da versão a publicar (ex: v2.0.0)"
        required: true
        default: "v2.0.0"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/arendcalls
      DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME || 'nathanarend' }}/arendcalls
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (GHCR + Docker Hub)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ env.TAG }}
            ${{ env.GHCR_IMAGE }}:latest
            ${{ secrets.DOCKERHUB_TOKEN != '' && format('{0}:{1}', env.DOCKERHUB_IMAGE, env.TAG) || '' }}
            ${{ secrets.DOCKERHUB_TOKEN != '' && format('{0}:latest', env.DOCKERHUB_IMAGE) || '' }}
          labels: |
            org.opencontainers.image.title=ArendCalls
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
