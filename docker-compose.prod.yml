version: '3.8'

services:
  arendcalls:
    image: nathanarend/arendcalls:latest
    container_name: arendcalls_server
    restart: unless-stopped
    network_mode: "host"
    environment:
      - API_KEY=
      - WA_PRESENCE_INTERVAL=
      # Chave AES-256-GCM para cifrar credenciais de gravação (se utilizado):
      # - RECORDING_CONFIG_KEY=troque_por_32_bytes_aleatorios_aqui
      # - GOMEMLIMIT=1500MiB
    volumes:
      - arendcalls_data:/app/data
      - arendcalls_recordings:/app/recordings
    expose:
      - "8080"
    ports:
      - "50000-50100:50000-50100/udp"
    networks:
      - network_public
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.arendcalls.rule=Host(`call.seudominio.com`)
        - traefik.http.routers.arendcalls.entrypoints=websecure
        - traefik.http.routers.arendcalls.tls.certresolver=letsencryptresolver
        - traefik.http.routers.arendcalls.middlewares=arendcalls-auth
        - traefik.http.middlewares.arendcalls-auth.basicauth.users=admin:$$apr1$$exemplo$$hash_gerado_aqui
        - traefik.http.services.arendcalls.loadbalancer.server.port=8080
        - traefik.http.services.arendcalls.loadbalancer.passHostHeader=true

volumes:
  arendcalls_data:
    driver: local
  arendcalls_recordings:
    driver: local

networks:
  network_public:
    external: true
